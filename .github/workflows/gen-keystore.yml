name: Generate Keystore
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS
        run: |
          keytool -genkeypair -v \
            -keystore auraplayer.jks \
            -alias auraplayer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=AuraPlayer, OU=Dev, O=Aura, L=CN, S=CN, C=CN"
          base64 -w 0 auraplayer.jks > keystore_base64.txt
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore
          path: |
            auraplayer.jks
            keystore_base64.txt
